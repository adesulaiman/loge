<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Loge · Home · mobile · dark</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Dela+Gothic+One&family=JetBrains+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="loge.css"><style>html,body{margin:0;background:#cfd6e4}[hidden]{display:none!important}</style></head><body><div data-theme="dark" style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; font-family: var(--font-ui); color: var(--text); background: var(--sky-base);">
<img class="loge-sky loge-sky--m loge-sky--light" src="sky-light.svg" alt="">
<img class="loge-sky loge-sky--m loge-sky--dark" src="sky-dark.svg" alt="">

<header style="position: relative; z-index: 2; height: 64px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 8px 12px 0;">
<button class="loge-item" aria-label="Open menu" style="width: 48px; height: 48px; border: 0; background: transparent; border-radius: 12px; color: var(--text); display: grid; place-items: center;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
</button>
<button class="loge-item" aria-haspopup="true" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px 0 8px; border: 0; background: transparent; border-radius: 12px; font-size: 16px; font-weight: 700; color: var(--text);">
<span style="width: 26px; height: 26px; border-radius: 8px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center;"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 2L4 14h7l-1.5 8L20 9.5h-7z"/></svg></span>
Loge Knowledge
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--text-3);"><path d="M6 9l6 6 6-6"/></svg>
</button>
<button class="loge-item" aria-label="New chat" style="width: 48px; height: 48px; border: 0; background: transparent; border-radius: 12px; color: var(--text); display: grid; place-items: center;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 00-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
</button>
</header>

<section style="position: relative; z-index: 2; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 26px 40px;">
<div class="loge-rise" style="display: flex; align-items: center; gap: 14px;">
<img src="mark.svg" alt="" width="64" height="64" style="display: block;">
<h1 style="margin: 0; font-family: var(--font-brand); font-size: 76px; line-height: .9; font-weight: 400; letter-spacing: .01em; text-transform: uppercase; color: var(--text);">L<span style="color: var(--accent);">o</span>ge</h1>
</div>
<p class="loge-rise" style="animation-delay: .08s; margin: 26px 0 0; max-width: 310px; text-align: center; font-size: 24px; line-height: 1.3; font-weight: 700; letter-spacing: -0.01em; color: var(--text);">Good evening. What do you need to know?</p>
<p class="loge-rise" style="animation-delay: .14s; margin: 10px 0 0; max-width: 300px; text-align: center; font-size: 15.5px; line-height: 1.6; color: var(--text-2);">Search your team's private knowledge. Every answer shows its sources.</p>
</section>

<div class="loge-composer loge-rise" style="animation-delay: .2s; position: relative; z-index: 2; flex: none; margin: 0 14px 18px; padding: 14px 12px 12px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; gap: 6px;">
<textarea class="loge-input" aria-label="Message Loge" rows="2" placeholder="Ask Loge anything…" style="width: 100%; min-height: 54px; font-size: 16px; line-height: 1.5;"></textarea>
<div style="display: flex; align-items: center; gap: 8px;">
<button aria-label="Attach a file" class="loge-item" style="width: 44px; height: 44px; border: 1px solid var(--border); background: transparent; border-radius: 10px; color: var(--text-2); display: grid; place-items: center; flex: none;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>
<button class="loge-item" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 8px 0 10px; border: 1px solid var(--border); background: transparent; border-radius: 10px; font-size: 14px; font-weight: 500; color: var(--text-2);">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l8 4-8 4-8-4 8-4z"/><path d="M4 12l8 4 8-4M4 16l8 4 8-4"/></svg>
All sources
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--text-3);"><path d="M6 9l6 6 6-6"/></svg>
</button>
<span style="flex: 1;"></span>
<button aria-label="Dictate" class="loge-item" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 10px; color: var(--text-2); display: grid; place-items: center; flex: none;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0013 0M12 18v3"/></svg>
</button>
<button aria-label="Send message" class="loge-send" style="width: 48px; height: 48px; border: 0; border-radius: 12px; background: var(--send-bg); color: var(--send-text); display: grid; place-items: center; box-shadow: var(--shadow-sm); flex: none;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M12 19V6M6 11l6-6 6 6"/></svg>
</button>
</div>
</div>
</div><script>
function LogePick(g,v){document.querySelectorAll('[data-group="'+g+'"]').forEach(function(e){e.hidden=e.getAttribute('data-val')!==v;});}
</script></body></html>
