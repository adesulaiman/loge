<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1440"><title>Loge · Home · desktop · dark</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Dela+Gothic+One&family=JetBrains+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="loge.css"><style>html,body{margin:0;background:#cfd6e4}[hidden]{display:none!important}</style></head><body><div data-theme="dark" style="position: relative; width: 1440px; height: 900px; overflow: hidden; display: flex; font-family: var(--font-ui); color: var(--text); background: var(--sky-base);">
<img class="loge-sky loge-sky--light" src="sky-light.svg" alt="">
<img class="loge-sky loge-sky--dark" src="sky-dark.svg" alt="">

<aside class="loge-slide" style="position: relative; z-index: 2; width: 272px; flex: none; height: 100%; display: flex; flex-direction: column; padding: 16px 12px 14px; background: var(--sidebar); border-right: 1px solid var(--hair);">
<div style="display: flex; align-items: center; gap: 10px; padding: 2px 6px 16px;">
<img src="mark.svg" alt="" width="34" height="34" style="display: block; flex: none;">
<span style="flex: 1; font-family: var(--font-brand); font-size: 24px; line-height: 1; letter-spacing: .02em; text-transform: uppercase;">L<span style="color: var(--accent);">o</span>ge</span>
<button class="loge-item" aria-label="Close sidebar" style="width: 40px; height: 40px; border: 0; background: transparent; border-radius: 10px; color: var(--text-2); display: grid; place-items: center;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></svg>
</button>
</div>

<button style="display: flex; align-items: center; gap: 10px; width: 100%; height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-sm); font-size: 15px; font-weight: 700; color: var(--text); text-align: left;">
<span style="color: var(--accent); display: grid; place-items: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
<span style="flex: 1;">New chat</span>
<span style="font-family: var(--font-hud); font-size: 12px; font-weight: 600; color: var(--text-3);">⌘ K</span>
</button>
<button class="loge-item" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 44px; margin-top: 4px; padding: 0 14px; border-radius: 10px; border: 0; background: transparent; font-size: 15px; color: var(--text-2); text-align: left;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
Search chats
</button>

<div class="loge-scroll" style="flex: 1; min-height: 0;">
<div style="font-family: var(--font-hud); font-size: 11.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); padding: 20px 14px 6px;">Today</div>
<button class="loge-item" style="display: block; width: 100%; height: 40px; line-height: 40px; padding: 0 14px; border: 0; background: transparent; border-radius: 10px; font-size: 14.5px; color: var(--text); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Vendor onboarding flow</button>
<button class="loge-item" style="display: block; width: 100%; height: 40px; line-height: 40px; padding: 0 14px; border: 0; background: transparent; border-radius: 10px; font-size: 14.5px; color: var(--text); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Certification document map</button>
<button class="loge-item" style="display: block; width: 100%; height: 40px; line-height: 40px; padding: 0 14px; border: 0; background: transparent; border-radius: 10px; font-size: 14.5px; color: var(--text); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Weekly report template</button>
<div style="font-family: var(--font-hud); font-size: 11.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); padding: 20px 14px 6px;">Yesterday</div>
<button class="loge-item" style="display: block; width: 100%; height: 40px; line-height: 40px; padding: 0 14px; border: 0; background: transparent; border-radius: 10px; font-size: 14.5px; color: var(--text); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Card service onboarding</button>
<button class="loge-item" style="display: block; width: 100%; height: 40px; line-height: 40px; padding: 0 14px; border: 0; background: transparent; border-radius: 10px; font-size: 14.5px; color: var(--text); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Privacy policy summary</button>
<div style="font-family: var(--font-hud); font-size: 11.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--text-3); padding: 20px 14px 6px;">Previous 7 days</div>
<button class="loge-item" style="display: block; width: 100%; height: 40px; line-height: 40px; padding: 0 14px; border: 0; background: transparent; border-radius: 10px; font-size: 14.5px; color: var(--text); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Release checklist</button>
<button class="loge-item" style="display: block; width: 100%; height: 40px; line-height: 40px; padding: 0 14px; border: 0; background: transparent; border-radius: 10px; font-size: 14.5px; color: var(--text); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Incident notes, early October</button>
</div>

<div class="loge-item" style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; margin-top: 8px;">
<span style="width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #2456E0, #0E1525); color: #FFFFFF; display: grid; place-items: center; font-family: var(--font-hud); font-weight: 700; font-size: 15px; flex: none;">R</span>
<span style="flex: 1; min-width: 0;">
<span style="display: block; font-size: 14.5px; font-weight: 700; color: var(--text);">Rina Putri</span>
<span style="display: block; font-size: 12.5px; color: var(--text-3);">Workspace admin</span>
</span>
<button aria-label="Settings" style="width: 40px; height: 40px; border: 0; background: transparent; border-radius: 10px; color: var(--text-2); display: grid; place-items: center;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
</button>
</div>
</aside>

<main style="position: relative; z-index: 2; flex: 1; min-width: 0; display: flex; flex-direction: column;">
<header style="height: 68px; display: flex; align-items: center; padding: 0 24px;">
<button class="loge-item" aria-haspopup="true" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px 0 8px; border: 0; background: transparent; border-radius: 12px; font-size: 16px; font-weight: 700; color: var(--text);">
<span style="width: 28px; height: 28px; border-radius: 8px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 2L4 14h7l-1.5 8L20 9.5h-7z"/></svg>
</span>
Loge Knowledge
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--text-3);"><path d="M6 9l6 6 6-6"/></svg>
</button>
</header>

<section style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 40px 96px;">
<div class="loge-rise" style="display: flex; align-items: center; gap: 22px;">
<img src="mark.svg" alt="" width="96" height="96" style="display: block;">
<h1 style="margin: 0; font-family: var(--font-brand); font-size: 116px; line-height: .9; font-weight: 400; letter-spacing: .01em; text-transform: uppercase; color: var(--text);">L<span style="color: var(--accent);">o</span>ge</h1>
</div>
<p class="loge-rise" style="animation-delay: .08s; margin: 34px 0 0; font-size: 30px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em; color: var(--text);">Good evening. What do you need to know?</p>
<p class="loge-rise" style="animation-delay: .14s; margin: 10px 0 0; max-width: 540px; text-align: center; font-size: 17px; line-height: 1.6; color: var(--text-2);">Search your team's private knowledge. Every answer shows its sources.</p>

<div class="loge-composer loge-rise" style="animation-delay: .22s; width: 720px; margin-top: 38px; padding: 18px 16px 14px 22px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; gap: 10px;">
<textarea class="loge-input" aria-label="Message Loge" rows="2" placeholder="Ask Loge anything…" style="width: 100%; min-height: 58px; font-size: 17px; line-height: 1.55;"></textarea>
<div style="display: flex; align-items: center; gap: 8px;">
<button aria-label="Attach a file" class="loge-item" style="width: 40px; height: 40px; border: 1px solid var(--border); background: transparent; border-radius: 10px; color: var(--text-2); display: grid; place-items: center;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>
<button class="loge-item" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px 0 12px; border: 1px solid var(--border); background: transparent; border-radius: 10px; font-size: 14.5px; font-weight: 500; color: var(--text-2);">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l8 4-8 4-8-4 8-4z"/><path d="M4 12l8 4 8-4M4 16l8 4 8-4"/></svg>
All sources
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--text-3);"><path d="M6 9l6 6 6-6"/></svg>
</button>
<span style="flex: 1;"></span>
<button aria-label="Dictate" class="loge-item" style="width: 40px; height: 40px; border: 0; background: transparent; border-radius: 10px; color: var(--text-2); display: grid; place-items: center;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0013 0M12 18v3"/></svg>
</button>
<button aria-label="Send message" class="loge-send" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--send-bg); color: var(--send-text); display: grid; place-items: center; box-shadow: var(--shadow-sm);">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" aria-hidden="true"><path d="M12 19V6M6 11l6-6 6 6"/></svg>
</button>
</div>
</div>
</section>
</main>
</div><script>
function LogePick(g,v){document.querySelectorAll('[data-group="'+g+'"]').forEach(function(e){e.hidden=e.getAttribute('data-val')!==v;});}
</script></body></html>
